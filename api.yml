version: "1.0"
baseUrl: "https://jsonplaceholder.typicode.com"
endpoints:
  get_post:
    protocol: "REST"
    path: "/posts/:id"
    method: "GET"
    timeout: 3000
  create_post:
    protocol: "REST"
    path: "/posts"
    method: "POST"
    timeout: 5000
  ws_test:
    protocol: "WS"
    path: "wss://echo.websocket.org" # Full URL for testing
    autoReconnect: true
  sse_test:
    protocol: "SSE"
    path: "http://localhost:3000/api-proxy/apps/api/v1/chat/completions"
    method: "POST"
    headers:
      "Content-Type": "application/json"